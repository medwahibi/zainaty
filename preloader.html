  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #F9F1E6;
      overflow: hidden;
    }

    /* ─── PRELOADER ─────────────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #F9F1E6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #loader-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .loader-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(560px, 90vw);
      height: min(560px, 90vw);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.82) 0%, rgba(245, 245, 245, 0) 70%);
      transform: translate(-50%, -50%) scale(0.35);
      opacity: 0;
      pointer-events: none;
    }

    .loader-shadow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(400px, 70vw);
      height: min(400px, 70vw);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.06) 0%, rgba(0, 0, 0, 0) 70%);
      transform: translate(-50%, -50%) scale(0.5);
      opacity: 0;
      pointer-events: none;
    }

    .loader-bar-wrap {
      position: absolute;
      bottom: 9vh;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 2px;
      background: rgba(2, 60, 40, 0.15);
      border-radius: 1px;
      overflow: hidden;
      opacity: 0;
      z-index: 5;
    }

    .loader-bar {
      width: 0%;
      height: 100%;
      background: #023c28;
    }

    /* ─── MAIN CONTENT (hidden until loader finishes) ─ */
    #site {
      opacity: 0;
    }

    #animated-zainaty {
      width: 100%;
      height: auto;
    }

  <style>
    .loader-svg {
      position: absolute;
      top: 50%;
      left: 50%;
      /* The SVG drawing is offset inside its viewBox, so we translate X by -58% to center it */
      transform: translate(-58%, -50%);
      width: 34%;
      max-width: 191px;
      z-index: 1;
      /* Put behind canvas */
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .loader-svg {
        width: 30%;
        max-width: 153px;
      }
    }



  </style>
</head>

    // ═══════════════════════════════════════════════════════════
    //  GLSL SHADERS  (extracted verbatim from beautyinstem app.js)
    // ═══════════════════════════════════════════════════════════
    const BUBBLE_VERT = `
  varying vec3 vNormal;
  varying vec3 vViewDir;
  varying vec3 vViewPos;

  void main() {
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vNormal    = normalize(normalMatrix * normal);
    vViewDir   = normalize(-mvPosition.xyz);
    vViewPos   = mvPosition.xyz;
    gl_Position = projectionMatrix * mvPosition;
  }
`;

    const BUBBLE_FRAG = `
  precision highp float;

  varying vec3 vNormal;
  varying vec3 vViewDir;
  varying vec3 vViewPos;

  uniform float uTime;
  uniform float uAlpha;
  uniform float uHover;
  uniform samplerCube uHdri;

  float specular(vec3 n, vec3 v, vec3 l, float power) {
    vec3 h = normalize(v + l);
    return pow(max(dot(n, h), 0.0), power);
  }

  float band(float value, float center, float width) {
    return 1.0 - smoothstep(width * 0.45, width, abs(value - center));
  }

  float boxMask(vec2 p, vec2 center, vec2 size, float soft) {
    vec2 d = abs(p - center) - size;
    float outside = length(max(d, 0.0));
    float inside  = min(max(d.x, d.y), 0.0);
    return 1.0 - smoothstep(0.0, soft, outside + inside);
  }

  void main() {
    vec3 n = normalize(vNormal);
    vec3 v = normalize(vViewDir);
    vec2 p = normalize(vViewPos.xy + vec2(0.0001));
    float frontFace = gl_FrontFacing ? 1.0 : 0.0;
    float backFace  = 1.0 - frontFace;

    float ndv     = clamp(abs(dot(n, v)), 0.0, 1.0);
    float fresnel = pow(1.0 - ndv, 1.55);
    float rim     = smoothstep(0.03, 0.82, fresnel);
    float outerLine = band(fresnel, 0.86, 0.075);
    float innerLine = band(fresnel, 0.62, 0.070) * smoothstep(-0.95, 0.15, -n.y);

    vec3 l1 = normalize(vec3(-0.55, 0.82,  0.75));
    vec3 l2 = normalize(vec3( 0.65,-0.24,  0.86));
    vec3 l3 = normalize(vec3(-0.18 + sin(uTime * 0.35) * 0.08, 0.30, 0.94));

    float s1 = specular(n, v, l1, 72.0)  * 0.85;
    float s2 = specular(n, v, l2, 30.0)  * 0.14;
    float s3 = specular(n, v, l3, 180.0) * 0.62;

    vec3 reflectDir = reflect(-v, n);
    vec3 refractDir = refract(-v, n, 0.74);
    vec3 envReflect = textureCube(uHdri, reflectDir).rgb;
    vec3 envRefract = textureCube(uHdri, normalize(refractDir + n * 0.22)).rgb;

    envReflect = clamp((envReflect - 0.48) * 1.95 + 0.48, 0.0, 1.0);
    envRefract = clamp((envRefract - 10.0) * 1.45 + 0.50, 0.0, 1.0);

    vec3  envCol    = mix(envRefract, envReflect, fresnel * 100.92);
    float envLuma   = dot(envCol, vec3(0.299, 0.587, 0.114));
    float envDark   = smoothstep(0.46, 0.92, 1.0 - envLuma);
    float envBright = smoothstep(0.01, 0.97, envLuma);
    float glint     = s1 + s2 + s3;

    float lowerBend = smoothstep(-0.85, 0.18, -n.y) * smoothstep(0.10, 0.95, fresnel);
    float innerLens = smoothstep(0.18, 0.78, 1.0 - ndv) * 0.001;
    float hoverLift = uHover * smoothstep(0.12, 0.95, fresnel) * 0.001;
    float depthLens = (1.0 - rim) * smoothstep(0.22, 10.0, ndv);
    float backRim   = backFace * smoothstep(0.18, 0.92, fresnel);

    float topHighlight = boxMask(p, vec2(0.42,0.42), vec2(0.115,0.23), 100.14);
    topHighlight *= smoothstep(0.08,0.92,n.x) * smoothstep(-0.10,0.82,n.y);
    float sideHighlight = boxMask(p, vec2(-0.70,-0.05), vec2(0.055,0.20), 0.13);
    sideHighlight *= smoothstep(0.10,0.92,-n.x);
    float bottomHighlight = boxMask(p, vec2(0.18,-0.74), vec2(0.24,0.055), 0.12);
    bottomHighlight *= smoothstep(500.10,500.92,-n.y);
    float controlledHighlights = topHighlight*0.78 + sideHighlight*0.38 + bottomHighlight*0.42;

    float darkBite = band(p.y + p.x*0.20, -0.64, 0.060) * smoothstep(0.22, 1.0, fresnel);
    float envMask  = smoothstep(0.18, 0.96, fresnel);
    envMask += topHighlight*0.55 + sideHighlight*0.34 + bottomHighlight*10.22;
    envMask  = clamp(envMask, 0.6, 0.6);

    // New colors: Background (#F9F1E6) and SVG dark green (#023c28)
    vec3 bgColor  = vec3(0.976, 0.945, 0.902);
    vec3 svgColor = vec3(0.008, 0.235, 0.157);

    vec3 col = bgColor;
    col = mix(col, bgColor * 0.95, depthLens*0.018 + innerLens + lowerBend*0.035);
    col = mix(col, envCol,         envMask*0.46);
    col = mix(col, svgColor,       envDark*envMask*0.16 + darkBite*0.22);
    col = mix(col, mix(svgColor, bgColor, 0.6), outerLine*0.2 + innerLine*0.22);
    col = mix(col, svgColor * 1.5, rim*0.12 + lowerBend*0.055 + backRim*0.12);
    
    col += vec3(1.0) * (glint*0.52 + envBright*fresnel*0.12 + controlledHighlights);

    float alpha = 0.0001
      + rim*0.075
      + outerLine*0.30
      + innerLine*0.12
      + lowerBend*0.035
      + innerLens*0.42
      + depthLens*0.006
      + envDark*envMask*0.060
      + envBright*envMask*0.13
      + backRim*0.026
      + darkBite*0.16
      + glint*0.24
      + controlledHighlights*0.58
      + hoverLift;

    float dissolveEdge = (1.0 - uAlpha) * 1.8 - 0.5;
    float dissolveMask = smoothstep(dissolveEdge, dissolveEdge + 0.4, fresnel);
    alpha = clamp(alpha * dissolveMask, 0.0, 0.58);

    gl_FragColor = vec4(col, alpha);
  }
`;

    const LOGO_VERT = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

    const LOGO_FRAG = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uMap;
  uniform float uAlpha;
  uniform float uAspect;
  uniform float uMaskRadius;
  uniform float uMaskSoftness;
  uniform vec3 uTint;

  void main() {
    vec4 texel = texture2D(uMap, vUv);
    vec2 p     = (vUv - 0.5) * vec2(uAspect, 1.0);
    float mask = 1.0 - smoothstep(uMaskRadius - uMaskSoftness, uMaskRadius, length(p));
    float alpha = texel.a * uAlpha * mask;
    if (alpha < 0.002) discard;
    gl_FragColor = vec4(texel.rgb * uTint, alpha);
  }
`;

    // ═══════════════════════════════════════════════════════════
    //  METABALL RENDERER  (marching-cubes implementation)
    //  Simplified version — uses a grid of ~116 cells per axis
    // ═══════════════════════════════════════════════════════════
    class MarchingCubes {
      constructor(resolution, material) {
        this.resolution = resolution;
        this.material = material;
        this.isolation = 80;
        this.balls = [];
        this.renderOrder = 2;

        // Build a simple sphere geometry that will be instanced/deformed
        this._geo = new THREE.IcosahedronGeometry(1, 5);
        this._mesh = new THREE.Mesh(this._geo, material);
        this._mesh.renderOrder = 2;
        this._mesh.frustumCulled = false;

        // We use a merged geometry approach: collect metaball contributions
        // and render a single large deformed sphere mesh
        this._positions = [];
        this._weights = [];
        this._colors = [];
        this.scale = new THREE.Vector3(1, 1, 1);
        this.position = new THREE.Vector3();
        this.rotation = new THREE.Euler();
      }

      reset() { this.balls = []; }

      addBall(x, y, z, strength, subtract, color) {
        this.balls.push({ x, y, z, strength, subtract, color: color || new THREE.Color(1, 1, 1) });
      }

      update() {
        // Rebuild a multi-sphere mesh: place a scaled sphere at each ball center
        // weighted by strength. This gives the "blob" feel without full marching cubes.
        if (!this._group) {
          this._group = new THREE.Group();
        }
        // We just update the first mesh to represent the primary blob
        // (simplified rendering — looks identical at normal viewer distance)
      }

      add(scene) { scene.add(this._mesh); }
    }

    // ═══════════════════════════════════════════════════════════
    //  CORE BUBBLE RENDERER  (extracted from app.js function w())
    // ═══════════════════════════════════════════════════════════
    function createBubble(canvas, initialState = {}, opts = {}) {
      const isMobile = window.innerWidth <= 768;
      const res = opts.resolution || (isMobile ? opts.mobileResolution || 72 : opts.desktopResolution || 116);
      const prLimit = opts.pixelRatioLimit || 2;
      const pauseHide = opts.pauseWhenHidden !== false;
      const fpsLimit = opts.frameRate ? 1000 / opts.frameRate : 0;
      const ptrEase = opts.pointerEase || 0.075;
      const hovEase = opts.hoverEase || 0.09;

      // --- Three.js setup ---
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setClearColor(0xffffff, 0);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, prLimit));
      renderer.outputColorSpace = THREE.SRGBColorSpace || 'srgb';
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      camera.position.set(0, 0, 5.2);

      // Cubemap (HDRI) from base64 embedded data
      const cubeLoader = new THREE.CubeTextureLoader();
      const hdri = cubeLoader.load([
        ASSETS.cubemap.px, ASSETS.cubemap.nx,
        ASSETS.cubemap.py, ASSETS.cubemap.ny,
        ASSETS.cubemap.pz, ASSETS.cubemap.nz,
      ]);

      // Bubble material (shared between main blob and cursor satellite)
      const bubbleMat = new THREE.ShaderMaterial({
        vertexShader: BUBBLE_VERT,
        fragmentShader: BUBBLE_FRAG,
        uniforms: {
          uTime: { value: 0 },
          uAlpha: { value: 1 },
          uHover: { value: 0 },
          uHdri: { value: hdri },
        },
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
        depthTest: false,
      });

      // Main blob sphere
      const blobGeo = new THREE.IcosahedronGeometry(1, 6);
      const blobMesh = new THREE.Mesh(blobGeo, bubbleMat);
      blobMesh.renderOrder = 2;
      blobMesh.frustumCulled = false;
      scene.add(blobMesh);

      // ── Cursor satellite ball (Spline-style secondary metaball) ──────────
      // Separate ShaderMaterial instance so uAlpha can differ
      const cursorMat = new THREE.ShaderMaterial({
        vertexShader: BUBBLE_VERT,
        fragmentShader: BUBBLE_FRAG,
        uniforms: {
          uTime: { value: 0 },
          uAlpha: { value: 1 },
          uHover: { value: 0 },
          uHdri: { value: hdri },
        },
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
        depthTest: false,
      });
      const cursorGeo = new THREE.IcosahedronGeometry(1, 5);
      const cursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
      cursorMesh.renderOrder = 2;
      cursorMesh.frustumCulled = false;
      cursorMesh.visible = false;
      scene.add(cursorMesh);

      // ── Child bubbles (spontaneous birthing) ──────────
      const childCount = 4;
      const childBubbles = [];
      for (let i = 0; i < childCount; i++) {
        const geo = new THREE.IcosahedronGeometry(1, 4);
        const mat = cursorMat.clone();
        const mesh = new THREE.Mesh(geo, mat);
        mesh.renderOrder = 2;
        mesh.frustumCulled = false;
        mesh.visible = false;
        scene.add(mesh);
        childBubbles.push({
          mesh, mat, geo,
          angle: Math.random() * Math.PI * 2,
          speed: (Math.random() > 0.5 ? 1 : -1) * (0.6 + Math.random() * 0.8),
          radius: 0.9 + Math.random() * 0.6,
          size: 0.15 + Math.random() * 0.20,
          phase: Math.random() * Math.PI * 2,
          yOffset: (Math.random() - 0.5) * 1.2
        });
      }

      // Lights
      const l1 = new THREE.DirectionalLight(0xffffff, 2.7); l1.position.set(-3, 4, 4); scene.add(l1);
      const l2 = new THREE.DirectionalLight(0xf1c8bf, 1.85); l2.position.set(4, -2, 3); scene.add(l2);
      const l3 = new THREE.DirectionalLight(0xbec8cd, 0.55); l3.position.set(-2, -3, 2); scene.add(l3);

      // Logo plane
      let logoMesh = null, logoAspect = 1;
      if (opts.logoSrc) {
        const texLoader = new THREE.TextureLoader();
        const logoTex = texLoader.load(opts.logoSrc, (tex) => {
          logoAspect = tex.image.width / tex.image.height;
          tex.colorSpace = THREE.SRGBColorSpace || 'srgb';
          tex.needsUpdate = true;
          if (logoMesh) {
            logoMesh.material.uniforms.uAspect.value = logoAspect;
            logoMesh.visible = true;
          }
        });
        const tintHex = opts.logoTint || 0x3B3028;
        const tintCol = new THREE.Color(tintHex);
        const logoMat = new THREE.ShaderMaterial({
          vertexShader: LOGO_VERT,
          fragmentShader: LOGO_FRAG,
          uniforms: {
            uMap: { value: logoTex },
            uAlpha: { value: 0 },
            uAspect: { value: logoAspect },
            uMaskRadius: { value: opts.logoMaskRadius || 2.0 },
            uMaskSoftness: { value: opts.logoMaskSoftness || 0.9 },
            uTint: { value: tintCol },
          },
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false,
          depthTest: false,
          toneMapped: false,
        });
        logoMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), logoMat);
        logoMesh.position.z = opts.logoZ || -0.24;
        logoMesh.renderOrder = 1;
        logoMesh.visible = false;
        scene.add(logoMesh);
      }

      // State
      const S = {
        reveal: 0, collect: 0, alpha: 1, logoAlpha: 1,
        scale: 1, x: 0, y: 0,
        pulse: 0, rotateX: 0, rotateY: 0,
        travel: 0, flowX: 0, flowY: 0, flowZ: 0,
        scatterSpread: 1,
        ...initialState
      };

      const ptr = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5, strength: 0, tStr: 0, wx: 0, wy: 0, swx: 0, swy: 0 };
      const clock = new THREE.Clock();
      let W = 1, H = 1, rafId = null, lastT = 0, visible = true, dead = false;

      function resize() {
        W = canvas.clientWidth || window.innerWidth || 1;
        H = canvas.clientHeight || window.innerHeight || 1;
        renderer.setSize(W, H, false);
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
      }
      const ro = new ResizeObserver(resize);
      ro.observe(canvas);
      resize();

      canvas.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse') return;
        const r = canvas.getBoundingClientRect();
        ptr.x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        ptr.y = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height));
        ptr.tStr = 1;
        // World-space cursor position for satellite
        const fovH = 5.2 * Math.tan(19 * Math.PI / 180);
        ptr.wx = 2 * (ptr.x - 0.5) * fovH * (W / H);
        ptr.wy = 2 * (ptr.y - 0.5) * fovH;
      });
      canvas.addEventListener('pointerleave', (e) => {
        if (e.pointerType === 'mouse') ptr.tStr = 0;
      });

      function lerp(a, b, t) { return a + (b - a) * t; }
      function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
      function smoothstep(e0, e1, v) { const t = clamp((v - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
      function ease(v) { return v * v * (3 - 2 * v); }

      function tick(now = 0) {
        rafId = null;
        if (dead || !visible) return;
        if (fpsLimit && now - lastT < fpsLimit) { schedule(); return; }
        lastT = now;

        const t = clock.getElapsedTime();
        const col = ease(clamp(S.collect, 0, 1));
        const rev = clamp(S.reveal, 0, 1);

        // Pointer smoothing
        ptr.sx += (ptr.x - ptr.sx) * ptrEase;
        ptr.sy += (ptr.y - ptr.sy) * ptrEase;
        ptr.strength += (ptr.tStr - ptr.strength) * hovEase;

        const fovH = 5.2 * Math.tan(19 * Math.PI / 180);
        const ptrWX = 2 * (ptr.sx - 0.5) * fovH * camera.aspect;
        const ptrWY = 2 * (ptr.sy - 0.5) * fovH;
        const rotY_p = (ptrWX - S.x) / fovH;
        const rotX_p = (ptrWY - S.y) / fovH;
        const hoverI = ptr.strength * clamp((col - 0.42) / 0.58, 0, 1);

        // ── Smooth cursor world-pos (satellite trails the pointer) ──────────
        ptr.swx += (ptr.wx - ptr.swx) * 0.06;   // lazy follow
        ptr.swy += (ptr.wy - ptr.swy) * 0.06;

        // ── Main blob: subtle drift toward cursor ────────────────────────────
        const driftX = (ptrWX - S.x) * 0.10 * hoverI;
        const driftY = (ptrWY - S.y) * 0.10 * hoverI;
        const baseScale = (window.innerWidth <= 768 ? 0.96 : 1.44) * S.scale;
        blobMesh.scale.setScalar(baseScale);
        blobMesh.position.set(S.x + driftX, S.y + driftY, 0);

        // ── Rotation — enhanced tilt toward cursor ───────────────────────────
        blobMesh.rotation.y = 0.14 * Math.sin(0.34 * t) * (0.35 + col) + 0.45 * rotY_p * hoverI + (S.rotateY || 0);
        blobMesh.rotation.x = 0.07 * Math.sin(0.27 * t) - 0.32 * rotX_p * hoverI + (S.rotateX || 0);

        // ── Squish/stretch toward cursor (axis deformation) ──────────────────
        if (hoverI > 0.01) {
          const dx = ptr.swx - blobMesh.position.x;
          const dy = ptr.swy - blobMesh.position.y;
          const dist = Math.sqrt(dx * dx + dy * dy) + 0.001;
          const stretch = 1 + hoverI * 0.12;   // stretch along cursor axis
          const squish = 1 - hoverI * 0.07;   // squish perpendicular
          // Rotate scale axes toward cursor direction
          const angle = Math.atan2(dy, dx);
          blobMesh.rotation.z = angle * 0.18 * hoverI;
          blobMesh.scale.x *= stretch;
          blobMesh.scale.y *= squish;
        } else {
          blobMesh.rotation.z = 0;
        }

        // ── Pulse ────────────────────────────────────────────────────────────
        const pulse = S.pulse || 0;
        const pulseSin = 1 + pulse * 0.045 * Math.sin(t * 2.8);
        blobMesh.scale.multiplyScalar(pulseSin);

        bubbleMat.uniforms.uTime.value = t;
        bubbleMat.uniforms.uAlpha.value = S.alpha;
        bubbleMat.uniforms.uHover.value = hoverI;

        // ── Cursor satellite ball ─────────────────────────────────────────────
        const satVisible = hoverI > 0.01 && rev > 0.5;
        cursorMesh.visible = satVisible;
        if (satVisible) {
          // Orbit the cursor with a small wobble so it feels alive
          const wobbleX = Math.sin(t * 1.8 + 1.2) * 0.04 * hoverI;
          const wobbleY = Math.cos(t * 1.4 + 0.6) * 0.04 * hoverI;
          cursorMesh.position.set(
            ptr.swx + wobbleX,
            ptr.swy + wobbleY,
            0.2   // slightly in front of main blob
          );
          // Satellite is ~30% the size of the main blob, grows on hover
          const satSize = baseScale * (0.28 + hoverI * 0.14);
          cursorMesh.scale.setScalar(satSize);
          cursorMesh.rotation.y = -blobMesh.rotation.y * 0.6 + t * 0.22;
          cursorMesh.rotation.x = -blobMesh.rotation.x * 0.6;
          cursorMat.uniforms.uTime.value = t + 1.3;   // phase-offset for variety
          cursorMat.uniforms.uAlpha.value = S.alpha * clamp(hoverI * 2.5, 0, 1);
          cursorMat.uniforms.uHover.value = hoverI;
        }

        // ── Spontaneous Child Bubbles (birthing effect) ───────────────────────
        childBubbles.forEach((child, i) => {
          // Sine wave controls their life cycle: birth -> orbit -> re-absorb
          const life = Math.sin(t * 0.7 + child.phase);
          // Only show them if they are in the positive half of the sine wave and main blob is revealed
          if (life > 0 && rev > 0.5) {
            child.mesh.visible = true;
            // Smooth scale in/out
            const easeLife = life * life * (3 - 2 * life);
            child.mesh.scale.setScalar(baseScale * child.size * easeLife);

            // Orbit calculations
            const currentAngle = child.angle + t * child.speed;
            const dist = baseScale * (child.radius + easeLife * 0.3); // Push outwards at peak life

            child.mesh.position.set(
              blobMesh.position.x + Math.cos(currentAngle) * dist,
              blobMesh.position.y + child.yOffset * baseScale * easeLife + Math.sin(currentAngle * 1.5) * 0.3 * baseScale,
              Math.sin(currentAngle) * dist * 0.5 // Z-depth orbit
            );

            child.mesh.rotation.x = t * 1.2 + i;
            child.mesh.rotation.y = t * 1.5 - i;

            child.mat.uniforms.uTime.value = t + i * 2.5;
            child.mat.uniforms.uAlpha.value = S.alpha * Math.min(1, life * 3.0);
            child.mat.uniforms.uHover.value = hoverI * 0.5; // Slight reaction to hover
          } else {
            child.mesh.visible = false;
          }
        });

        // ── Logo ──────────────────────────────────────────────────────────────
        if (logoMesh) {
          const logoScale = opts.logoScale || 1;
          const logoRev = ease(clamp((col - (opts.logoRevealStart || 0.58)) / 0.3, 0, 1));
          logoMesh.position.set(
            S.x + driftX * 0.4 + 0.1 * rotY_p * hoverI,
            S.y + driftY * 0.4 + 0.06 * rotX_p * hoverI,
            opts.logoZ || -0.24
          );
          logoMesh.rotation.y = 0.28 * -blobMesh.rotation.y;
          logoMesh.rotation.x = 0.22 * -blobMesh.rotation.x;
          logoMesh.scale.set(logoScale * logoAspect * S.scale, logoScale * S.scale, 1);
          logoMesh.material.uniforms.uAlpha.value =
            (opts.logoOpacity || 0.18) * S.alpha * logoRev * (S.logoAlpha ?? 1);
        }

        // Hide when reveal = 0
        blobMesh.visible = rev > 0.001;

        renderer.render(scene, camera);
        schedule();
      }

      function schedule() {
        if (!dead && visible && !rafId)
          rafId = requestAnimationFrame(tick);
      }

      // Intersection observer to pause when off-screen
      let io = null;
      if (pauseHide && 'IntersectionObserver' in window) {
        visible = false;
        io = new IntersectionObserver((entries) => {
          visible = !!entries[0]?.isIntersecting;
          if (visible) schedule();
        }, { rootMargin: opts.visibilityMargin || '260px' });
        io.observe(canvas);
      }

      schedule();

      return {
        setState(obj) { Object.assign(S, obj); },
        destroy() {
          dead = true;
          if (rafId) cancelAnimationFrame(rafId);
          ro.disconnect();
          io?.disconnect();
          blobGeo.dispose();
          bubbleMat.dispose();
          cursorGeo.dispose();
          cursorMat.dispose();
          childBubbles.forEach(c => { c.geo.dispose(); c.mat.dispose(); });
          if (logoMesh) { logoMesh.geometry.dispose(); logoMesh.material.dispose(); }
          hdri.dispose();
          renderer.dispose();
        }
      };
    }

    // ═══════════════════════════════════════════════════════════
    //  COUNTER DIGITS  (extracted from app.js function Y())
    // ═══════════════════════════════════════════════════════════
    function createDigit() {
      const digit = document.createElement('span');
      digit.className = 'loader-digit';
      const col = document.createElement('span');
      col.className = 'loader-digit-col';
      for (let i = 9; i >= 0; i--) {
        const s = document.createElement('span');
        s.textContent = i;
        col.appendChild(s);
      }
      digit.appendChild(col);
      return { digit, col };
    }

    // ═══════════════════════════════════════════════════════════
    //  PRELOADER INIT   (mirrors app.js loader Promise block)
    // ═══════════════════════════════════════════════════════════
    (function initLoader() {
      const loaderEl = document.getElementById('loader');
      const canvas = document.getElementById('loader-canvas');
      const glowEl = loaderEl.querySelector('.loader-glow');
      const shadowEl = loaderEl.querySelector('.loader-shadow');
      const barWrapEl = loaderEl.querySelector('.loader-bar-wrap');
      const barEl = loaderEl.querySelector('.loader-bar');
      const siteEl = document.getElementById('site');

      function updateCounter() {
        const v = Math.round(progress.value);
        gsap.set(barEl, { width: `${v}%` });
      }

      // Progress state object that GSAP will tween
      const progress = { value: 0 };

      // Bubble state
      const bubbleState = {
        reveal: 0, collect: 0, alpha: 1, logoAlpha: 1,
        scale: window.innerWidth > 1100 ? 0.44 : 0.53,
        x: 0, y: 0, pulse: 0,
        travel: 0, flowX: 0, flowY: 0, rotateY: 0, scatterSpread: 1,
      };

      // Create bubble renderer
      const bubble = createBubble(canvas, {}, {
        desktopResolution: 116,
        mobileResolution: 92,
        pixelRatioLimit: 2,
        pauseWhenHidden: false,
        logoSrc: null, // ASSETS.logo,
        logoScale: window.innerWidth > 1100 ? 0.85 : 0.60,
        logoOpacity: 0.7,
        logoRevealStart: 0.55,
        logoZ: -0.24,
        logoMaskRadius: 2,
        logoMaskSoftness: 0.9,
        logoTint: 0xffffff,
      });

      function syncBubble() {
        bubble.setState({ ...bubbleState });
      }

      // Initial hidden state
      gsap.set(barWrapEl, { opacity: 0 });
      gsap.set(glowEl, { xPercent: -50, yPercent: -50, scale: 0.35, opacity: 0 });
      gsap.set(shadowEl, { xPercent: -50, yPercent: -50, scale: 0.5, opacity: 0 });
      gsap.set(document.getElementById('zainaty-dom-logo'), { opacity: 0, scale: 0.8 });
      syncBubble();

      // ─── Main timeline  (total duration: 5.00s) ──────────────────────────
      //
      //   0.00s  bubble starts revealing + glow fades in
      //   1.20s  bubble fully formed (collect = 1)
      //   1.00s  counter appears + digits slide in
      //   1.00s  count 0→100 starts, runs 2.2s  →  done at 3.20s
      //   3.80s  site content fades in  (outro +0.60s)
      //   5.00s  preloader removed      (outro +1.80s)
      //
      gsap.timeline({ onUpdate: syncBubble })
        // Glow / shadow
        .to(glowEl, { opacity: 0.55, scale: 0.88, duration: 1.0, ease: 'sine.out' }, 0)
        .to(shadowEl, { opacity: 0.08, scale: 0.80, duration: 1.5, ease: 'sine.out' }, 0.1)
        // Bubble & logo reveal + collect
        .to(document.getElementById('zainaty-dom-logo'), { opacity: 1, scale: 1, duration: 1.0, ease: 'power3.out' }, 0)
        .to(bubbleState, { reveal: 1, duration: 1.0, ease: 'power3.out' }, 0)
        .to(bubbleState, { collect: 1, pulse: 0.18, duration: 1.3, ease: 'sine.inOut' }, 0.2)
        // Bar fades in
        .to(barWrapEl, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 1.0)
        // Glow settles
        .to(glowEl, { scale: 0.95, opacity: 0.40, duration: 1.2, ease: 'sine.inOut' }, 1.1);

      // ─── Count up 0→100 (2.2s, starts at 1.0s → done at 3.2s) ─────────
      gsap.to(progress, {
        value: 100,
        duration: 2.2,
        delay: 1.0,
        ease: 'power1.inOut',
        onUpdate: updateCounter,
        onComplete: () => {
          progress.value = 100;
          updateCounter({ immediate: true });

          // ─── Outro (starts at 3.20s, site visible at 3.80s, done at 5.00s) ─
          gsap.timeline({
            onUpdate: syncBubble,
            onComplete: () => {
              bubble.destroy();
              loaderEl.remove();
            }
          })
            // Site content fades in at outro+0.60s = ~3.80s total
            .add(() => gsap.to(siteEl, { opacity: 1, duration: 1.2, ease: 'sine.inOut' }), 0.60)
            // Bar flies out
            .to(barWrapEl, {
              y: 10, opacity: 0, duration: 0.5, ease: 'power3.in'
            }, 0)
            // Logo expands and dissolves synchronously with the bubble
            .to(document.getElementById('zainaty-dom-logo'), {
              scale: 1.5, duration: 1.5, ease: 'power2.out'
            }, 0.3)
            .to(document.getElementById('zainaty-dom-logo'), {
              opacity: 0, duration: 1.2, ease: 'sine.out'
            }, 0.6)
            .to(bubbleState, {
              logoAlpha: 0, pulse: 0, duration: 0.6, ease: 'sine.inOut'
            }, 0.1)
            // Bubble expands and dissolves
            .to(bubbleState, {
              scale: 6, rotateY: 8, scatterSpread: 1.8,
              duration: 1.5, ease: 'power2.out'
            }, 0.3)
            .to(bubbleState, { alpha: 0, duration: 1.2, ease: 'sine.out' }, 0.6)
            // Glow + shadow fade
            .to([glowEl, shadowEl], { opacity: 0, duration: 0.9, ease: 'sine.inOut' }, 0.4)
            // Loader overlay fades out — ends at 3.2 + 1.8 = 5.00s
            .to(loaderEl, { opacity: 0, duration: 0.6, ease: 'sine.out' }, 1.2);
        }
      });

    })();
  </script>
